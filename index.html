<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Vibe Lab</title>
<meta name="description" content="아이들과 함께 노는 작은 음악 게임들">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: a short shelf of game cards under the lab's name. */
:root{
  --bg:#E9F3F1; --surface:#FFFFFF; --ink:#173B3F; --muted:#56726F; --water:#2C7DA0; --azalea:#D9467A; --line:rgba(23,59,63,.14);
  --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0D1B20; --surface:#14272D; --ink:#E4F1EE; --muted:#9DB8B4; --water:#5FB3D6; --azalea:#F0709D; --line:rgba(228,241,238,.14); color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2{font-family:var(--font-display);font-weight:400;margin:0}
h1{font-size:40px;color:var(--water)} h1 span{color:var(--azalea)}
.lead{margin:4px 0 0;color:var(--muted)}
.section{font-size:13px;color:var(--muted);letter-spacing:1px;margin:0 0 8px}
a.card{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;text-decoration:none;color:inherit;
  background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
a.card:hover,a.card:focus-visible{border-color:var(--water);box-shadow:0 4px 0 var(--water);outline:none}
.pebble{width:56px;height:44px;border-radius:50%;background:var(--water);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-size:20px}
.card h2{font-size:22px} .card p{margin:0;color:var(--muted);font-size:14px}
footer{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Vibe <span>Lab</span></h1>
    <p class="lead">아이들과 함께 노래하며 노는 작은 게임들</p>
  </header>
  <section>
    <p class="section">음악</p>
    <a class="card" href="music/pongdang-rhythm/">
      <span class="pebble">도</span>
      <span><h2>퐁당 리듬놀이</h2><p>동요 가락에 맞춰 조약돌을 톡톡 누르며 따라 불러요</p></span>
    </a>
  </section>
  <footer>thevibelab.net</footer>
</div>
</body>
</html>
